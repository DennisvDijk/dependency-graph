# Include from an application repository:
#   include:
#     - project: <tool-group>/depgraph
#       file: ci/depgraph-mr-check.yml
#
# The job is allowed to fail so a missing snapshot or token cannot block the
# merge request. It posts one note and updates that same note on later pipelines.

depgraph-mr-check:
  stage: test
  image: ${DEPGRAPH_IMAGE:-debian:bookworm-slim}
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      changed=$(git diff --name-only "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-HEAD~1}"...HEAD || true)
      args=()
      while IFS= read -r path; do
        [ -z "$path" ] && continue
        args+=(--changed-file "$path")
      done <<< "$changed"
      depgraph mr-check \
        --snapshot "${DEPGRAPH_SNAPSHOT:-data/snapshot.json}" \
        --project "${CI_PROJECT_PATH}" \
        --mr-iid "${CI_MERGE_REQUEST_IID}" \
        "${args[@]}"
