# Pipeline for when depgraph runs inside GitLab.
# This repository itself is on GitHub (ADR-002). GitHub Actions is the CI that
# gates the tool repo; the `test` job below runs the same checks (fmt, clippy,
# test, deny) so a GitLab mirror is gated the same way. The other jobs are the
# collector pipeline from the plan.
#
# `build` is `depgraph build` (the graph), not `cargo build`. The Rust image
# compiles the binary in before_script so every job can call it. A static
# musl binary is a later packaging step; runners already benefit from one
# binary and no virtualenv.
#
# Create three schedules in the GitLab UI (CI/CD → Schedules). The YAML cannot
# register cron entries itself:
#   fast    0 */6 * * *   COLLECT_SET=fast
#   full    30 3 * * *    COLLECT_SET=full
#   weekly  0 7 * * 1     COLLECT_SET=full  SCHEDULE_KIND=weekly
#
# Schedules run the real commands. They need GITLAB_TOKEN or glab auth on the
# runner. drift-issue stays a local note until there is a previous snapshot
# to compare; measuring drift on real data is for Dennis.

include:
  - local: .gitlab/release.yml

stages:
  - test
  - collect
  - build
  - publish
  - release-build
  - release-sign
  - release-publish

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: "0.20.2"
  # Behind a firewall: mirror the cargo-deny release tarball and set
  # CARGO_DENY_URL in Settings > CI/CD > Variables. Point cargo at your crates
  # mirror in the runner config when crates.io is not reachable.

default:
  image: rust:1.100.0-bookworm
  interruptible: true
  cache:
    key:
      files: [Cargo.lock]
    paths: [.cargo/registry, target]

.test-template: &rust_job
  before_script:
    - cargo build --release --locked

test:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  script:
    # The official rust image ships without rustfmt and clippy.
    - rustup component add rustfmt clippy
    - cargo fmt --all -- --check
    - cargo clippy --all-targets --all-features -- -D warnings
    - cargo test --all-targets --all-features
    - cargo build --release --locked
    - ./target/release/depgraph validate tests/fixtures/empty-graph.json
    - ./target/release/depgraph collect --set full --fixture tests/fixtures/phase1 --output data
    - ./target/release/depgraph build --raw data/raw --output data/snapshot.json --aliases tests/fixtures/phase1/aliases.yaml
    - ./target/release/depgraph site --snapshot data/snapshot.json --output public
    - |
      name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
      url="${CARGO_DENY_URL:-https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz}"
      curl -fsSL -o /tmp/cargo-deny.tar.gz "$url"
      tar -xzf /tmp/cargo-deny.tar.gz -C /tmp
      install -m 0755 "/tmp/${name}/cargo-deny" /usr/local/bin/cargo-deny
    - cargo deny check

collect:
  <<: *rust_job
  stage: collect
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - test -n "${COLLECT_SET}"
    - ./target/release/depgraph collect --set "${COLLECT_SET}" --output data
  artifacts:
    paths:
      - data

build:
  <<: *rust_job
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  needs: ["collect"]
  script:
    - ./target/release/depgraph build --raw data/raw --output data/snapshot.json
  artifacts:
    paths:
      - data

publish-snapshot:
  <<: *rust_job
  stage: publish
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  needs: ["build"]
  script:
    - ./target/release/depgraph publish snapshot --snapshot data/snapshot.json --output data/published.json

pages:
  <<: *rust_job
  stage: publish
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  needs: ["build"]
  script:
    - ./target/release/depgraph site --snapshot data/snapshot.json --output public
  artifacts:
    paths:
      - public

drift-issue:
  <<: *rust_job
  stage: publish
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_KIND == "weekly"
  script:
    - ./target/release/depgraph publish drift-issue --snapshot data/snapshot.json --project "${CI_PROJECT_PATH}"
