# Source environment names map onto exactly one of dev, acc, prod.
# Opt-in: true uses the guess for an unmapped namespace (shop-prod -> prod)
# instead of leaving its calls out; `depgraph build` lists every guess.
# A namespace mapped below always wins. Off by default (ADR-008).
guess_namespaces: false
dev:
  gitlab:
    - development
  otel:
    - dev
    - development
  # k8s_namespaces:
  #   - payments-dev
  k8s_namespaces: []
acc:
  gitlab:
    - acceptance
    - staging
  otel:
    - acc
    - staging
  # k8s_namespaces:
  #   - payments-acc
  k8s_namespaces: []
prod:
  gitlab:
    - production
  otel:
    - prod
    - production
  # k8s_namespaces:
  #   - payments-prod
  k8s_namespaces: []
