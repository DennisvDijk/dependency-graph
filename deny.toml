[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
unmaintained = "workspace"
yanked = "warn"
# chrono was declared unmaintained on 2026-11 (no known vulnerability, no safe
# upgrade). Revisit: move the timestamp code to `time` or `jiff`.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; no vulnerability, migration planned" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
