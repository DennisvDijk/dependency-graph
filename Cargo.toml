[package]
name = "depgraph"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "Apache-2.0"
description = "Self-hosted dependency graph for runtime dependencies and deployments"
readme = "README.md"

# petgraph and kube/k8s-openapi land with graph algorithms and optional live
# cluster reads. HTTP uses reqwest on rustls (ADR-002).

[dependencies]
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
rpassword = "7"
jsonschema = { version = "0.61", default-features = false }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
schemars = "1.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
yaml_serde = "0.10"
petgraph = "0.8"
jsonwebtoken = "9"
axum = "0.8"
clap_complete = "4"
hcl-edit = "0.10.0"
jiff = { version = "1.0.0", default-features = false, features = ["std"] }

[dev-dependencies]
assert_cmd = "2"
base64 = "0.22"
insta = { version = "1.49", features = ["json"] }
predicates = "3"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# Smaller, faster release binary. `strip` also keeps build paths out of it.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
