[package]
name = "depgraph"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "UNLICENSED"
description = "Self-hosted dependency graph for runtime dependencies and deployments"
readme = "README.md"

# HTTP, graph algorithms, and the Kubernetes client land with the first real
# collector and analysis pass. The mapping is ADR-002; F0-1 keeps them out of
# the build so stubs do not pretend to talk to source systems.
#   petgraph, reqwest (rustls) + tokio, kube, k8s-openapi

[dependencies]
clap = { version = "4.6", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
hex = "0.4"
regex = "1"
schemars = "1.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
yaml_serde = "0.10"

[dev-dependencies]
assert_cmd = "2"
insta = { version = "1.49", features = ["json"] }
jsonschema = { version = "0.61", default-features = false }
predicates = "3"
tempfile = "3"
