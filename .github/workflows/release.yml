name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/depgraph" dist/depgraph
          tar -C dist -czf "depgraph-${{ matrix.target }}.tar.gz" depgraph
      - uses: actions/upload-artifact@v4
        with:
          name: depgraph-${{ matrix.target }}
          path: depgraph-${{ matrix.target }}.tar.gz

  publish:
    name: github release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: depgraph-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: depgraph-*.tar.gz
