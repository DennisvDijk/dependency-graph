# Signed release for GitHub. It publishes only for a tag such as v0.2.0.
#
# A release contains:
#   depgraph-<target>.tar.gz   the binaries
#   SHA256SUMS                 checksums of the files above and the SBOM
#   sbom.cdx.json              CycloneDX dependency list
#   <file>.bundle              cosign signature and certificate for each file
#
# Signing is keyless: GitHub gives the job a short-lived identity token and
# cosign trades it for a certificate that names this workflow and this tag.
# Each archive also gets a build provenance attestation (`gh attestation verify`).
# Verify steps: docs/releases.md.
#
# Actions that touch the release are pinned to a commit. Dependabot or a manual
# bump moves them; the comment says which tag each commit is.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/depgraph" dist/depgraph
          tar -C dist -czf "depgraph-${{ matrix.target }}.tar.gz" depgraph
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: depgraph-${{ matrix.target }}
          path: depgraph-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: sign and publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # keyless signing identity
      attestations: write # build provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: depgraph-*
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
      - name: SBOM and checksums
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --override-filename sbom
          mv sbom.json sbom.cdx.json
          sha256sum depgraph-*.tar.gz sbom.cdx.json > SHA256SUMS
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign every file, then check our own signature
        env:
          COSIGN_YES: "true"
          IDENTITY: ^https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/
          ISSUER: https://token.actions.githubusercontent.com
        run: |
          for file in depgraph-*.tar.gz sbom.cdx.json SHA256SUMS; do
            cosign sign-blob --bundle "${file}.bundle" "$file"
            # Verify the way a user will; a failure stops the release.
            cosign verify-blob --bundle "${file}.bundle" \
              --certificate-identity-regexp "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" "$file"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: depgraph-*.tar.gz
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          fail_on_unmatched_files: true
          files: |
            depgraph-*.tar.gz
            sbom.cdx.json
            SHA256SUMS
            *.bundle
