name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: fmt, clippy, test, deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Benchmark scores
        run: |
          set -o pipefail
          cargo test --test benchmark -- --nocapture 2>&1 | tee benchmark-report.txt
          { echo '### Benchmark'; echo '```'; grep -E 'truth|precision|recall|missed|extra|->' benchmark-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Install cargo-deny
        run: |
          version=0.20.2
          curl -fsSL -o /tmp/cargo-deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${version}/cargo-deny-${version}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/cargo-deny.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/cargo-deny-${version}-x86_64-unknown-linux-musl/cargo-deny" /usr/local/bin/cargo-deny
      - name: cargo deny
        run: cargo deny check

  image:
    name: docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t depgraph:ci .
      - name: Runs as non-root and answers --help
        run: |
          docker run --rm depgraph:ci --help | grep -q serve-mcp
          test "$(docker inspect depgraph:ci --format '{{.Config.User}}')" = "nonroot:nonroot"
      - name: Serves, passes its healthcheck, stops on SIGTERM
        run: |
          mkdir -p data
          echo '{"schema_version":"0.1.0","run_id":"ci","generated_at":"2026-01-01T00:00:00Z","sources":{},"nodes":[],"edges":[]}' > data/snapshot.json
          docker run -d --name dg -v "$PWD/config:/app/config:ro" -v "$PWD/data:/app/data:ro" depgraph:ci
          sleep 3
          docker exec dg /usr/local/bin/depgraph healthcheck
          docker stop -t 10 dg
          test "$(docker inspect dg --format '{{.State.ExitCode}}')" = "0"
